name: Build Android WebView App for Vercel with Start.io Ads

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Capacitor
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          bun install

      - name: Prepare Web Directory with Start.io Script
        run: |
          mkdir -p public_empty
          cat << 'EOF' > public_empty/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <script type="text/javascript" src="https://www.startappservice.com/wp/js/sdk/v1/startapp.js"></script>
            <script>
              window.addEventListener("load", function() {
                try {
                  if (window.StartApp) {
                    window.StartApp.init("208760526");
                    window.StartApp.showBanner();
                  }
                } catch(e) {
                  console.log("Start.io Ad Error:", e);
                }
              });
            </script>
            <meta http-equiv="refresh" content="0;url=https://zaid-app0.vercel.app/">
          </head>
          <body></body>
          </html>
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Android platform with Capacitor
        run: |
          npx cap init "كتاب آل الجنيد" zaid.app.family --web-dir public_empty
          npx cap add android

      - name: Configure Capacitor Server URL
        run: |
          echo '{
            "appId": "zaid.app.family",
            "appName": "كتاب آل الجنيد",
            "webDir": "public_empty",
            "server": {
              "url": "https://zaid-app0.vercel.app/",
              "cleartext": true
            }
          }' > capacitor.config.json
          npx cap copy android

      - name: Copy App Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true

      - name: Build Signed APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-signed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
