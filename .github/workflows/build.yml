name: Build Release AAB with AdMob

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies & AdMob
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob
          bun install

      - name: Build Web App
        run: |
          bun run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Android platform with Capacitor
        run: |
          npx cap init "كتاب آل الجنيد" zaid.app.family --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/application>/i \    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5626894045921428~1826738433"/>' $MANIFEST_PATH

      - name: Copy App Icon from public/
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Build Release AAB with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
