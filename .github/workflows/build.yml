name: Build Web App to Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies with Bun
        run: |
          bun install

      - name: Build Web App
        run: |
          bun run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Android platform with Capacitor
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          # تم تحديد اسم التطبيق هنا
          npx cap init "كتاب آل الجنيد" zaid.app.family --web-dir dist
          npx cap add android
          npx cap copy android

      # --- تم إضافة هذا الجزء لنسخ الأيقونة من مجلد public ---
      - name: Copy App Icon from public/
        run: |
          # نسخ الأيقونة الرئيسية وتوزيعها على مجلدات الأيقونات
          # نستخدم -f للفرض، و -v لعرض الملفات المنسوخة في السجل
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-ldpi/ic_launcher.png
          # عمل نسخة احتياطية لأيقونة الإشعارات (اختياري)
          cp -fv public/icon-512.png android/app/src/main/res/drawable/ic_stat_name.png || echo "drawable folder not found, skipping"
      # --- نهاية الجزء المضاف ---

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
