name: Build Release Signed APK with Start.io

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          bun install

      - name: Build Web App
        run: |
          bun run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Android platform with Capacitor
        run: |
          npx cap init "كتاب آل الجنيد" zaid.app.family --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Copy App Icon from public/
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zaid, OU=App, O=Family, L=Sanaa, C=YE"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign --ks android/app/release.keystore --ks-pass pass:123456 --out android/app/build/outputs/apk/release/app-release-signed.apk android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Store Ready Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
