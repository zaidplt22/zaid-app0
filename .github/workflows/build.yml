name: Build Android WebView App for Vercel with Start.io Ads

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Capacitor
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          bun install

      - name: Prepare Full Screen Iframe Web Directory
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>كتاب آل الجنيد</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              html, body { width: 100%; height: 100%; overflow: hidden; background-color: #1c1917; }
              #app-frame { width: 100%; height: 100%; border: none; display: block; }
            </style>
            <script type="text/javascript" src="https://www.startappservice.com/wp/js/sdk/v1/startapp.js"></script>
            <script>
              window.addEventListener("load", function() {
                try {
                  if (window.StartApp) {
                    window.StartApp.init("208760526");
                    window.StartApp.showBanner();
                  }
                } catch(e) {
                  console.log("Start.io Ad Error:", e);
                }
              });
            </script>
          </head>
          <body>
            <iframe id="app-frame" src="https://zaid-app0.vercel.app/"></iframe>
          </body>
          </html>
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Android platform with Capacitor
        run: |
          npx cap init "كتاب آل الجنيد" zaid.app.family --web-dir dist
          npx cap add android

      - name: Configure Capacitor Settings
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "zaid.app.family",
            "appName": "كتاب آل الجنيد",
            "webDir": "dist",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap copy android

      - name: Copy App Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true

      - name: Build Signed APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-signed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
