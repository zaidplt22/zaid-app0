name: Build Signed Release APK with Start.io

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          bun install

      - name: Inject Start.io SDK into HTML
        run: |
          if [ -f "public/index.html" ]; then
            echo '<script type="text/javascript" src="https://www.startappservice.com/wp/js/sdk/v1/startapp.js"></script>' >> public/index.html
            echo '<script>window.addEventListener("load", function() { try { if (window.StartApp) { window.StartApp.init("208760526"); window.StartApp.showBanner(); } } catch(e) {} });</script>' >> public/index.html
          fi

      - name: Build Web App
        run: |
          bun run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Android platform with Capacitor
        run: |
          npx cap init "كتاب آل الجنيد" zaid.app.family --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Copy App Icon from public/
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp -fv public/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Build Signed APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-signed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
